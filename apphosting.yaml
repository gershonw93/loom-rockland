# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Small program — keep instances low to stay well within the free allotment.
  minInstances: 0
  maxInstances: 2

env:
  # Non-secret identifiers — safe to keep in source.
  - variable: FIREBASE_PROJECT_ID
    value: loom-rockland
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@loom-rockland.iam.gserviceaccount.com
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: loom-rockland.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # Secrets — stored in Cloud Secret Manager, never in source.
  # Create them with:
  #   firebase apphosting:secrets:set firebase-private-key
  #   firebase apphosting:secrets:set admin-password
  - variable: FIREBASE_PRIVATE_KEY
    secret: firebase-private-key
    availability:
      - RUNTIME
  - variable: ADMIN_PASSWORD
    secret: admin-password
    availability:
      - RUNTIME

  # ── Email notifications (SMTP) ────────────────────────────────
  # New-application emails go to support@loomrockland.org with the submission
  # CSV attached. Uncomment and fill in for your mail provider, then create the
  # password secret:
  #   firebase apphosting:secrets:set smtp-pass
  #   firebase apphosting:secrets:grantaccess smtp-pass
  # If these are left unset, submissions still work — the email is just skipped.
  #
  # - variable: SMTP_HOST      # e.g. smtp.gmail.com / smtp-relay.gmail.com / smtp.resend.com
  #   value: smtp.gmail.com
  #   availability: [RUNTIME]
  # - variable: SMTP_PORT
  #   value: "587"
  #   availability: [RUNTIME]
  # - variable: SMTP_USER      # SMTP username (often the sending address)
  #   value: support@loomrockland.org
  #   availability: [RUNTIME]
  # - variable: MAIL_FROM      # From header
  #   value: LOOM Rockland <support@loomrockland.org>
  #   availability: [RUNTIME]
  # - variable: MAIL_TO        # Recipient (defaults to support@loomrockland.org)
  #   value: support@loomrockland.org
  #   availability: [RUNTIME]
  # - variable: SMTP_PASS      # SMTP password / app password / API key (secret)
  #   secret: smtp-pass
  #   availability: [RUNTIME]
