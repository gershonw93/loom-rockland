# Firebase App Hosting configuration.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Small program — keep instances low to stay well within the free allotment.
  minInstances: 0
  maxInstances: 2

env:
  # Non-secret identifiers — safe to keep in source.
  - variable: FIREBASE_PROJECT_ID
    value: loom-rockland
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@loom-rockland.iam.gserviceaccount.com
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: loom-rockland.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  # Secrets — stored in Cloud Secret Manager, never in source.
  # Create them with:
  #   firebase apphosting:secrets:set firebase-private-key
  #   firebase apphosting:secrets:set admin-password
  - variable: FIREBASE_PRIVATE_KEY
    secret: firebase-private-key
    availability:
      - RUNTIME
  - variable: ADMIN_PASSWORD
    secret: admin-password
    availability:
      - RUNTIME

  # ── Email notifications (SMTP · Google Workspace / Gmail) ─────
  # New-application emails go to support@loomrockland.org with the submission
  # CSV attached. These non-secret settings are safe to keep here; email stays
  # OFF (skipped) until the smtp-pass secret below is created and enabled.
  - variable: SMTP_HOST
    value: smtp.gmail.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "587"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: support@loomrockland.org
    availability:
      - RUNTIME
  - variable: MAIL_FROM
    value: LOOM Rockland <support@loomrockland.org>
    availability:
      - RUNTIME
  - variable: MAIL_TO
    value: support@loomrockland.org
    availability:
      - RUNTIME

  # SMTP password = a Google "App Password" (16 chars) for the support@ account
  # (requires 2-Step Verification on that account). To turn email ON:
  #   firebase apphosting:secrets:set smtp-pass         # paste the app password
  #   firebase apphosting:secrets:grantaccess smtp-pass
  # then UNCOMMENT the three lines below and redeploy.
  # - variable: SMTP_PASS
  #   secret: smtp-pass
  #   availability:
  #     - RUNTIME
